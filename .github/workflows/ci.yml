name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Check linting (Ruff)
      run: uv run ruff check .
    - name: Check formatting (Ruff)
      run: uv run ruff format --check .
  test:
    name: Test Coverage Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sapphire
          POSTGRES_DB: sapphire_test
        ports:
        - 54329:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5 --tmpfs /var/lib/postgresql/data
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    # Docs/specs / markdown-only PRs skip Playwright + E2E; app-touching paths keep full suite.
    - name: Detect app-touching paths
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          needs_e2e:
            - 'app/**'
            - 'tests/**'
            - 'scripts/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - '.github/workflows/**'
            - '**/*.py'
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Initialize Test Database Schema
      env:
        TEST_DATABASE_URL: postgresql://postgres:sapphire@localhost:54329/sapphire_test
        DATABASE_URL: postgresql://postgres:sapphire@localhost:54329/sapphire_test
      run: uv run python -c "from app.db.connection import init_db; init_db()"
    - name: Resolve Playwright version
      if: steps.filter.outputs.needs_e2e == 'true'
      id: playwright
      run: |
        PW_VER=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
        echo "version=${PW_VER}" >> "$GITHUB_OUTPUT"
        echo "Playwright version: ${PW_VER}"
    - name: Cache Playwright browsers
      if: steps.filter.outputs.needs_e2e == 'true'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Playwright browsers (cache miss)
      if: steps.filter.outputs.needs_e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: uv run playwright install --with-deps
    - name: Install Playwright OS deps (cache hit)
      if: steps.filter.outputs.needs_e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: uv run playwright install-deps
    - name: Run test suite with E2E and coverage gate (>90%)
      if: steps.filter.outputs.needs_e2e == 'true'
      env:
        TEST_DATABASE_URL: postgresql://postgres:sapphire@localhost:54329/sapphire_test
        # Pytest session fixture also forces DATABASE_URL → sapphire_test.
        DATABASE_URL: postgresql://postgres:sapphire@localhost:54329/sapphire_test
      run: uv run pytest --cov=app --cov-fail-under=90 -v
    - name: Run test suite without E2E (docs/markdown-only) with coverage gate (>90%)
      if: steps.filter.outputs.needs_e2e != 'true'
      env:
        TEST_DATABASE_URL: postgresql://postgres:sapphire@localhost:54329/sapphire_test
        DATABASE_URL: postgresql://postgres:sapphire@localhost:54329/sapphire_test
      run: uv run pytest --cov=app --cov-fail-under=90 -v --ignore=tests/test_e2e_dashboard.py
  # Mutation testing moved to .github/workflows/mutation-nightly.yml
  # (schedule + main path pushes + workflow_dispatch). PRs are not blocked by mutmut.
