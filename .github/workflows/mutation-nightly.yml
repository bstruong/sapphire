name: Mutation Nightly

# Mutation gate on main: path-filtered allowlist *diff* on push, weekly
# full-allowlist on schedule, plus on-demand full via workflow_dispatch.
# Pull requests are NOT blocked by mutation — they keep lint + coverage + agent review.
# Runs on Watchtower self-hosted runners (homelab Option-1 github-runner); not a
# PR required check.
#
# Circuit breaker (DinD service containers): Watchtower DinD cannot extract
# postgres:15 (overlayfs whiteout EPERM). Do NOT use jobs.*.services postgres.
# Point at host Postgres on the Watchtower node (podman sapphire-mutation-pg
# publishing :54329) — see homelab-k3s manifests/watchtower/github-runner/README.md.
on:
  schedule:
    # Weekly full-allowlist Sunday 08:00 UTC (not daily — quota / runner cost)
    - cron: "0 8 * * 0"
  push:
    branches:
      - main
    paths:
      - "app/pipeline/**"
      - "app/adapters/**"
      - "app/extraction/**"
      - "app/models/**"
      - "app/db/repository.py"
      - "app/db/connection.py"
      - "app/db/__init__.py"
      - "scripts/run_mutation_on_diff.py"
      - "scripts/check_mutation_score.py"
      - "pyproject.toml"
      - ".github/workflows/mutation-nightly.yml"
  workflow_dispatch:

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation Testing (main)
    runs-on: [self-hosted, watchtower]
    # Failures here are required for main health, not for PR merge.
    # No jobs.*.services: host Postgres on Watchtower :54329 (circuit breaker).
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve host Postgres URL
        id: db
        run: |
          # Prefer runner-injected node IP; else DNS for the Watchtower node.
          # Host podman publishes sapphire-mutation-pg on 0.0.0.0:54329.
          if [ -z "${WATCHTOWER_HOST_IP:-}" ]; then
            WATCHTOWER_HOST_IP="$(getent hosts watchtower | awk '{print $1}' | head -n1)"
          fi
          if [ -z "${WATCHTOWER_HOST_IP}" ]; then
            echo "::error::WATCHTOWER_HOST_IP unset and host 'watchtower' did not resolve"
            exit 1
          fi
          echo "host_ip=${WATCHTOWER_HOST_IP}" >> "$GITHUB_OUTPUT"
          echo "Using host Postgres at ${WATCHTOWER_HOST_IP}:54329 (no Actions service container)"
      - name: Wait for host Postgres
        run: |
          python3 - <<'PY'
          import os, socket, time
          host = os.environ["HOST_IP"]
          port = 54329
          deadline = time.time() + 60
          while time.time() < deadline:
              sock = socket.socket()
              sock.settimeout(2)
              try:
                  if sock.connect_ex((host, port)) == 0:
                      print(f"host Postgres reachable at {host}:{port}")
                      raise SystemExit(0)
              finally:
                  sock.close()
              time.sleep(2)
          raise SystemExit(f"host Postgres not reachable at {host}:{port} within 60s")
          PY
        env:
          HOST_IP: ${{ steps.db.outputs.host_ip }}
      - name: Install dependencies
        run: uv sync
      - name: Initialize Test Database Schema
        env:
          TEST_DATABASE_URL: ${{ format('postgresql://postgres:sapphire@{0}:54329/sapphire_test', steps.db.outputs.host_ip) }}
          DATABASE_URL: ${{ format('postgresql://postgres:sapphire@{0}:54329/sapphire_test', steps.db.outputs.host_ip) }}
        run: uv run python -c "from app.db.connection import init_db; init_db()"
      - name: Resolve mutmut cache fingerprint
        id: mutmut_meta
        run: |
          MUTMUT_VER=$(uv run python -c 'import importlib.metadata as m; print(m.version("mutmut"))')
          CONFIG_HASH=$(sha256sum pyproject.toml scripts/run_mutation_on_diff.py scripts/check_mutation_score.py | sha256sum | cut -d' ' -f1)
          echo "mutmut_ver=${MUTMUT_VER}" >> "$GITHUB_OUTPUT"
          echo "config_hash=${CONFIG_HASH}" >> "$GITHUB_OUTPUT"
      - name: Cache mutmut
        uses: actions/cache@v4
        with:
          path: .mutmut-cache
          # Commit SHA omitted from key so cache hits across commits
          key: mutmut-nightly-${{ steps.mutmut_meta.outputs.mutmut_ver }}-${{ steps.mutmut_meta.outputs.config_hash }}
      - name: Run mutation & quality score gate
        # Playwright is intentionally NOT installed: E2E tests are ignored via
        # [tool.mutmut] pytest_add_cli_args and hidden by run_mutation_on_diff.py.
        # Push → allowlisted diff; schedule / workflow_dispatch → full allowlist.
        env:
          TEST_DATABASE_URL: ${{ format('postgresql://postgres:sapphire@{0}:54329/sapphire_test', steps.db.outputs.host_ip) }}
          DATABASE_URL: ${{ format('postgresql://postgres:sapphire@{0}:54329/sapphire_test', steps.db.outputs.host_ip) }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Path-filtered main push: running allowlisted diff mutation"
            uv run python scripts/run_mutation_on_diff.py
          else
            echo "Schedule/dispatch: running full-allowlist mutation"
            uv run python scripts/run_mutation_on_diff.py --full-allowlist
          fi
          uv run python scripts/check_mutation_score.py --min-score 55.0 --max-no-tests 0
      - name: Upload mutation stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cicd-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
