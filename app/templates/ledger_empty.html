<section class="view ledger-result" data-nav="statements">
    <header class="page-head">
        <h1>Vault Ledger</h1>
        <p>Templated ledger from Postgres</p>
    </header>
    <div class="card">
        <div class="empty">
            <div class="empty-art"><svg class="icon"><use href="#i-doc"/></svg></div>
            <h2>No persisted statements yet</h2>
            <p>Upload a Chase or Schwab PDF to the Vault and its ledger appears here.</p>
            <button type="button" class="btn btn-primary"
                    hx-get="/api/v1/dashboard/statements"
                    hx-target="#pane-vault-body"
                    hx-swap="innerHTML"><svg class="icon"><use href="#i-upload"/></svg>Upload a statement</button>
        </div>
    </div>
</section>
