<section class="view" id="account-overview" data-nav="overview">
    <header class="page-head">
        <h1>Account overview</h1>
        <p>Balances from your latest statements</p>
    </header>
    <div class="card">
        <div class="empty">
            <div class="empty-art"><svg class="icon"><use href="#i-doc"/></svg></div>
            <h2>No persisted statements yet</h2>
            <p>Upload a Chase or Schwab PDF. It is parsed on this machine and your balances appear here.</p>
            <button type="button" class="btn btn-primary"
                    hx-get="/api/v1/dashboard/statements"
                    hx-target="#pane-vault-body"
                    hx-swap="innerHTML"><svg class="icon"><use href="#i-upload"/></svg>Upload your first statement</button>
        </div>
    </div>
</section>
