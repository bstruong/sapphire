<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPPHIRE - Financial Intelligence Dashboard</title>
    <script>
        // Apply theme before first paint: stored preference, else prefers-color-scheme.
        (function () {
            var stored = null;
            try {
                stored = window.localStorage.getItem("sapphire-theme");
            } catch (err) {
                stored = null;
            }
            var theme;
            if (stored === "dark" || stored === "light") {
                theme = stored;
            } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                theme = "dark";
            } else {
                theme = "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="/static/sapphire.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <!-- Inline SVG sprite: icons used by the shell and every HTMX fragment. -->
    <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></symbol>
        <symbol id="i-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2" fill="currentColor"/></symbol>
        <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v6c0 4.5 3.2 7.8 7.5 9 4.3-1.2 7.5-4.5 7.5-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
        <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><circle cx="12" cy="16" r=".8" fill="currentColor"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    </svg>

    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l3 18 3-18"/></svg>
                </div>
                <div class="brand-name">SAPPHIRE</div>
            </div>

            <nav class="nav" aria-label="Primary">
                <div class="nav-label">Money</div>
                <button type="button" id="nav-overview" aria-current="page"
                        hx-get="/api/v1/dashboard/overview"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-home"/></svg>Overview</button>
                <button type="button" id="nav-budget"
                        hx-get="/api/v1/dashboard/budget"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-wallet"/></svg>Budget</button>
                <button type="button" id="nav-statements"
                        hx-get="/api/v1/dashboard/statements"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-doc"/></svg>Statements</button>
                <div class="nav-label spaced">Verify</div>
                <button type="button" id="nav-audit"
                        hx-get="/api/v1/dashboard/audit"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-shield"/></svg>Audit</button>
            </nav>

            <div class="vault-card">
                <div class="row"><span class="dot"></span>Local Vault online</div>
                <ul>
                    <li><span>Parsing</span><span>On-device</span></li>
                    <li><span>PII to cloud</span><span>Never</span></li>
                    <li><span>Precision</span><span>Integer cents</span></li>
                </ul>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-title" id="topbar-title">Overview</div>
                <div class="topbar-actions">
                    <button type="button" id="theme-toggle" class="theme-toggle"
                            aria-label="Switch to dark theme" title="Switch to dark theme">
                        <svg class="icon icon-moon"><use href="#i-moon"/></svg>
                        <svg class="icon icon-sun"><use href="#i-sun"/></svg>
                    </button>
                    <button type="button" id="topbar-upload" class="btn btn-primary"
                            hx-get="/api/v1/dashboard/statements"
                            hx-target="#pane-vault-body"
                            hx-swap="innerHTML"
                            hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-upload"/></svg>Upload statement</button>
                </div>
            </header>
            <div class="content" id="pane-vault-body">
                {{ vault_pane_html | safe }}
            </div>
        </main>
    </div>

    <script>
        function currentTheme() {
            return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        }

        function applyTheme(theme) {
            var toggle = document.getElementById("theme-toggle");
            var label = theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
            document.documentElement.setAttribute("data-theme", theme);
            toggle.setAttribute("aria-label", label);
            toggle.setAttribute("title", label);
            try {
                window.localStorage.setItem("sapphire-theme", theme);
            } catch (err) {
                // Storage can be blocked (private mode); the toggle still works for this page view.
            }
        }

        document.getElementById("theme-toggle").addEventListener("click", function () {
            applyTheme(currentTheme() === "dark" ? "light" : "dark");
        });
        applyTheme(currentTheme());

        var PAGE_TITLES = {
            overview: "Overview",
            budget: "Budget",
            statements: "Statements",
            audit: "Audit"
        };

        // Highlight the sidebar item and update the topbar title from data-nav.
        document.body.addEventListener("htmx:afterSwap", function (event) {
            if (!event.detail.target || event.detail.target.id !== "pane-vault-body") {
                return;
            }
            var fragment = event.detail.target.querySelector("[data-nav]");
            if (!fragment) {
                return;
            }
            var nav = fragment.getAttribute("data-nav");
            var active = "nav-" + nav;
            document.querySelectorAll(".nav button").forEach(function (button) {
                if (button.id === active) {
                    button.setAttribute("aria-current", "page");
                } else {
                    button.removeAttribute("aria-current");
                }
            });
            var title = document.getElementById("topbar-title");
            if (title && PAGE_TITLES[nav]) {
                title.textContent = PAGE_TITLES[nav];
            }
            window.scrollTo({ top: 0 });
        });

        document.body.addEventListener("htmx:beforeSwap", function (event) {
            var xhr = event.detail.xhr;
            if (!xhr || !xhr.responseURL) {
                return;
            }
            var url = xhr.responseURL;
            var isFrontier = url.indexOf("/api/v1/dashboard/frontier-audit") !== -1;
            var isUpload = url.indexOf("/api/v1/dashboard/upload") !== -1;
            var isAnalyze = url.indexOf("/api/v1/dashboard/analyze") !== -1;
            var isStatement = url.indexOf("/api/v1/dashboard/statements") !== -1;
            var isOverview = url.indexOf("/api/v1/dashboard/overview") !== -1;
            var isBudget = url.indexOf("/api/v1/dashboard/budget") !== -1;
            var isAudit = url.indexOf("/api/v1/dashboard/audit") !== -1;
            if ((isFrontier || isUpload || isAnalyze || isStatement || isOverview || isBudget || isAudit) && xhr.status === 400) {
                event.detail.shouldSwap = true;
                event.detail.isError = false;
            }
        });
    </script>
</body>
</html>
