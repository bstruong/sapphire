<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPPHIRE - Financial Intelligence Dashboard</title>
    <script>
        // Apply theme before first paint: stored preference, else prefers-color-scheme.
        (function () {
            var stored = null;
            try {
                stored = window.localStorage.getItem("sapphire-theme");
            } catch (err) {
                stored = null;
            }
            var theme;
            if (stored === "dark" || stored === "light") {
                theme = stored;
            } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                theme = "dark";
            } else {
                theme = "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="/static/sapphire.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <a class="skip-link" href="#pane-vault-body">Skip to dashboard content</a>
    <!-- Inline SVG sprite: icons used by the shell and every HTMX fragment. -->
    <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></symbol>
        <symbol id="i-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2" fill="currentColor"/></symbol>
        <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v6c0 4.5 3.2 7.8 7.5 9 4.3-1.2 7.5-4.5 7.5-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
        <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></symbol>
        <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><circle cx="12" cy="16" r=".8" fill="currentColor"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    </svg>

    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l3 18 3-18"/></svg>
                </div>
                <div class="brand-name">SAPPHIRE</div>
            </div>

            <nav class="nav" aria-label="Primary">
                <div class="nav-label">Money</div>
                <button type="button" id="nav-overview" aria-current="page"
                        hx-get="/api/v1/dashboard/overview"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-home"/></svg>Overview</button>
                <button type="button" id="nav-budget"
                        hx-get="/api/v1/dashboard/budget"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-wallet"/></svg>Budget</button>
                <button type="button" id="nav-statements"
                        hx-get="/api/v1/dashboard/statements"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-doc"/></svg>Statements</button>
                <div class="nav-label spaced">Verify</div>
                <button type="button" id="nav-audit"
                        hx-get="/api/v1/dashboard/audit"
                        hx-target="#pane-vault-body"
                        hx-swap="innerHTML"
                        hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-shield"/></svg>Audit</button>
            </nav>

            <div class="vault-card">
                <div class="row"><span class="dot"></span>Local Vault online</div>
                <ul>
                    <li><span>Parsing</span><span>On-device</span></li>
                    <li><span>PII to cloud</span><span>Never</span></li>
                    <li><span>Precision</span><span>Integer cents</span></li>
                </ul>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-heading">
                    <span class="topbar-kicker">Private financial workspace</span>
                    <div class="topbar-title" id="topbar-title">Overview</div>
                </div>
                <div class="topbar-actions">
                    <button type="button" id="theme-toggle" class="theme-toggle"
                            aria-label="Switch to dark theme" title="Switch to dark theme">
                        <svg class="icon icon-moon"><use href="#i-moon"/></svg>
                        <svg class="icon icon-sun"><use href="#i-sun"/></svg>
                    </button>
                    <button type="button" id="topbar-upload" class="btn btn-primary"
                            hx-get="/api/v1/dashboard/statements"
                            hx-target="#pane-vault-body"
                            hx-swap="innerHTML"
                            hx-indicator="#pane-vault-body"><svg class="icon"><use href="#i-upload"/></svg>Upload statement</button>
                </div>
            </header>
            <div class="content" id="pane-vault-body">
                {{ vault_pane_html | safe }}
            </div>
        </main>
    </div>

    <script>
        function currentTheme() {
            return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        }

        function applyTheme(theme) {
            var toggle = document.getElementById("theme-toggle");
            var label = theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
            document.documentElement.setAttribute("data-theme", theme);
            toggle.setAttribute("aria-label", label);
            toggle.setAttribute("title", label);
            try {
                window.localStorage.setItem("sapphire-theme", theme);
            } catch (err) {
                // Storage can be blocked (private mode); the toggle still works for this page view.
            }
        }

        document.getElementById("theme-toggle").addEventListener("click", function () {
            applyTheme(currentTheme() === "dark" ? "light" : "dark");
        });
        applyTheme(currentTheme());

        var PAGE_TITLES = {
            overview: "Overview",
            budget: "Budget",
            statements: "Statements",
            audit: "Audit"
        };

        // Highlight the sidebar item and update the topbar title from data-nav.
        document.body.addEventListener("htmx:afterSwap", function (event) {
            if (!event.detail.target || event.detail.target.id !== "pane-vault-body") {
                return;
            }
            var fragment = event.detail.target.querySelector("[data-nav]");
            if (!fragment) {
                return;
            }
            var nav = fragment.getAttribute("data-nav");
            var active = "nav-" + nav;
            document.querySelectorAll(".nav button").forEach(function (button) {
                if (button.id === active) {
                    button.setAttribute("aria-current", "page");
                } else {
                    button.removeAttribute("aria-current");
                }
            });
            var title = document.getElementById("topbar-title");
            if (title && PAGE_TITLES[nav]) {
                title.textContent = PAGE_TITLES[nav];
            }
            window.scrollTo({ top: 0 });
        });

        // Hidden file input: surface count / basenames in the dropzone label.
        document.body.addEventListener("change", function (event) {
            var input = event.target;
            if (!input || input.id !== "statement-file") {
                return;
            }
            var dropzone = document.getElementById("upload-dropzone");
            var prompt = document.getElementById("upload-prompt");
            var filename = document.getElementById("upload-filename");
            if (!dropzone || !prompt || !filename) {
                return;
            }
            var list = input.files ? Array.prototype.slice.call(input.files) : [];
            if (list.length === 1) {
                prompt.textContent = list[0].name;
                filename.textContent = "Ready to upload · stays on this Vault · max 20 files";
                dropzone.classList.add("has-file");
            } else if (list.length > 1) {
                var names = list.slice(0, 3).map(function (f) { return f.name; }).join(", ");
                if (list.length > 3) {
                    names += ", …";
                }
                prompt.textContent = list.length + " PDFs selected · click to change";
                filename.textContent = names + " · max 20 files";
                dropzone.classList.add("has-file");
            } else {
                prompt.textContent = "Drop PDFs here or click to choose";
                filename.textContent = "PDF only · parsed on this Vault · max 20 files";
                dropzone.classList.remove("has-file");
            }
        });

        // Upload progress bar: single-file advancing bar via HTMX indicator;
        // bulk uses sequential upload-item calls with determinate N of M.
        function uploadProgressEls() {
            return {
                root: document.getElementById("upload-progress"),
                label: document.getElementById("upload-progress-label"),
                bar: document.getElementById("upload-progress-bar"),
                fill: document.getElementById("upload-progress-fill"),
                btn: document.getElementById("upload-btn")
            };
        }

        function setUploadProgressPct(pct) {
            var els = uploadProgressEls();
            if (!els.fill || !els.bar) {
                return;
            }
            var clamped = Math.max(0, Math.min(100, Math.round(pct)));
            els.fill.style.width = clamped + "%";
            els.bar.setAttribute("aria-valuenow", String(clamped));
        }

        function showUploadProgress(labelText, opts) {
            var els = uploadProgressEls();
            if (!els.root) {
                return;
            }
            opts = opts || {};
            els.root.classList.add("is-active");
            els.root.classList.toggle("is-advancing", !!opts.advancing);
            if (els.label) {
                els.label.textContent = labelText;
            }
            if (typeof opts.pct === "number") {
                setUploadProgressPct(opts.pct);
            }
            if (els.btn) {
                els.btn.disabled = true;
            }
        }

        function hideUploadProgress() {
            var els = uploadProgressEls();
            if (!els.root) {
                return;
            }
            els.root.classList.remove("is-active", "is-advancing");
            setUploadProgressPct(0);
            if (els.label) {
                els.label.textContent = "Uploading…";
            }
            if (els.btn) {
                els.btn.disabled = false;
            }
        }

        document.body.addEventListener("htmx:beforeRequest", function (event) {
            var path = (event.detail.pathInfo && event.detail.pathInfo.requestPath) || "";
            if (path.indexOf("/api/v1/dashboard/upload") === -1) {
                return;
            }
            // Single-file (or non-JS bulk fallback): advancing bar through the request.
            showUploadProgress("Uploading…", { advancing: true, pct: 0 });
        });

        document.body.addEventListener("htmx:xhr:progress", function (event) {
            var detail = event.detail || {};
            var path = (detail.pathInfo && detail.pathInfo.requestPath) || "";
            if (path.indexOf("/api/v1/dashboard/upload") === -1) {
                return;
            }
            if (!detail.lengthComputable || !detail.total) {
                return;
            }
            var els = uploadProgressEls();
            if (els.root) {
                els.root.classList.remove("is-advancing");
            }
            setUploadProgressPct((detail.loaded / detail.total) * 100);
        });

        document.body.addEventListener("htmx:afterRequest", function (event) {
            var path = (event.detail.pathInfo && event.detail.pathInfo.requestPath) || "";
            if (path.indexOf("/api/v1/dashboard/upload") === -1) {
                return;
            }
            // Bulk sequential path manages its own lifecycle.
            if (document.body.dataset.uploadBulkActive === "1") {
                return;
            }
            hideUploadProgress();
        });

        document.body.addEventListener("htmx:confirm", function (event) {
            var elt = event.detail.elt;
            if (!elt || elt.id !== "upload-form") {
                return;
            }
            var input = document.getElementById("statement-file");
            var files = input && input.files ? Array.prototype.slice.call(input.files) : [];
            if (files.length <= 1) {
                // Let HTMX post the single file (ledger swap + advancing bar).
                return;
            }
            // Bulk: take over with sequential upload-item + N of M progress.
            event.preventDefault();
            runBulkUploadWithProgress(files);
        });

        function runBulkUploadWithProgress(files) {
            var total = files.length;
            var results = [];
            var pane = document.getElementById("pane-vault-body");
            document.body.dataset.uploadBulkActive = "1";

            function finish(html) {
                document.body.dataset.uploadBulkActive = "0";
                hideUploadProgress();
                if (pane && typeof html === "string") {
                    pane.innerHTML = html;
                    if (window.htmx) {
                        window.htmx.process(pane);
                    }
                }
            }

            function failLoud(message) {
                document.body.dataset.uploadBulkActive = "0";
                hideUploadProgress();
                if (pane) {
                    pane.innerHTML =
                        '<section class="view" data-nav="statements">' +
                        '<div class="alert" role="alert">' +
                        '<svg class="icon"><use href="#i-alert"/></svg>' +
                        "<div><h4>Upload failed</h4>" +
                        "<p><code>UPLOAD_PROGRESS_FAILED</code> — " +
                        String(message).replace(/</g, "&lt;") +
                        "</p></div></div></section>";
                }
            }

            function step(index) {
                if (index >= total) {
                    showUploadProgress("Uploaded " + total + " of " + total, { pct: 100 });
                    return fetch("/api/v1/dashboard/upload-summary", {
                        method: "POST",
                        headers: {
                            "HX-Request": "true",
                            "Content-Type": "application/json",
                            Accept: "text/html"
                        },
                        body: JSON.stringify({ results: results })
                    }).then(function (resp) {
                        return resp.text().then(function (text) {
                            if (!resp.ok) {
                                throw new Error(text || ("summary HTTP " + resp.status));
                            }
                            finish(text);
                        });
                    }).catch(function (err) {
                        failLoud(err && err.message ? err.message : String(err));
                    });
                }

                var file = files[index];
                var n = index + 1;
                showUploadProgress("Uploading " + n + " of " + total, {
                    pct: (index / total) * 100
                });

                var formData = new FormData();
                formData.append("files", file, file.name);

                return fetch("/api/v1/dashboard/upload-item", {
                    method: "POST",
                    headers: {
                        "HX-Request": "true",
                        Accept: "application/json"
                    },
                    body: formData
                }).then(function (resp) {
                    return resp.json().then(function (body) {
                        if (!resp.ok && (!body || typeof body.ok !== "boolean")) {
                            throw new Error(
                                (body && body.detail) || ("upload-item HTTP " + resp.status)
                            );
                        }
                        results.push({
                            filename: body.filename || file.name,
                            ok: !!body.ok,
                            statement_id: body.statement_id || null,
                            run_id: body.run_id || null,
                            error_code: body.error_code || null,
                            detail: body.detail || null,
                            adapter_id: body.adapter_id || null
                        });
                        showUploadProgress("Uploading " + n + " of " + total, {
                            pct: (n / total) * 100
                        });
                        return step(index + 1);
                    });
                }).catch(function (err) {
                    failLoud(err && err.message ? err.message : String(err));
                });
            }

            step(0);
        }

        document.body.addEventListener("htmx:beforeSwap", function (event) {
            var xhr = event.detail.xhr;
            if (!xhr || !xhr.responseURL) {
                return;
            }
            var url = xhr.responseURL;
            var isFrontier = url.indexOf("/api/v1/dashboard/frontier-audit") !== -1;
            var isUpload = url.indexOf("/api/v1/dashboard/upload") !== -1;
            var isAnalyze = url.indexOf("/api/v1/dashboard/analyze") !== -1;
            var isStatement = url.indexOf("/api/v1/dashboard/statements") !== -1;
            var isOverview = url.indexOf("/api/v1/dashboard/overview") !== -1;
            var isBudget = url.indexOf("/api/v1/dashboard/budget") !== -1;
            var isAudit = url.indexOf("/api/v1/dashboard/audit") !== -1;
            if ((isFrontier || isUpload || isAnalyze || isStatement || isOverview || isBudget || isAudit) && xhr.status === 400) {
                event.detail.shouldSwap = true;
                event.detail.isError = false;
            }
        });
    </script>
</body>
</html>
