# SAPPHIRE Vault — Postgres + API for local demos.
# Dogfood DB name is `sapphire` (never `sapphire_test`).
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sapphire
      POSTGRES_DB: sapphire
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sapphire"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  vault:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:sapphire@db:5432/sapphire
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
